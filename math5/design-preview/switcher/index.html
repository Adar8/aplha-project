<title>MATH5 — שלוש חלופות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: a fixed segmented switcher bar on top, full-bleed iframe below showing the live concept */
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --ink:#15181d; --sub:#5b6270; --line:#dde1e6;
    --accent:#2f6fed; --accent-ink:#ffffff; --chip:#eef1f5;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1115; --panel:#181b21; --ink:#edf0f4; --sub:#9aa3b2; --line:#2a2e37;
      --accent:#5b8ef7; --accent-ink:#0f1115; --chip:#20242c; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1115; --panel:#181b21; --ink:#edf0f4; --sub:#9aa3b2; --line:#2a2e37;
    --accent:#5b8ef7; --accent-ink:#0f1115; --chip:#20242c; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    display:flex; flex-direction:column; direction:rtl;
  }
  header{
    padding-block:10px 12px;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
    padding-top:calc(10px + env(safe-area-inset-top,0px));
    background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:8px; flex-shrink:0;
  }
  .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  h1{font-size:14px; font-weight:700; margin:0; color:var(--sub); letter-spacing:.02em; text-transform:uppercase}
  .tabs{display:flex; gap:4px; background:var(--chip); border-radius:10px; padding:3px; flex-wrap:wrap}
  .tabs button{
    appearance:none; border:none; background:transparent; color:var(--sub);
    font:inherit; font-weight:600; font-size:13px; padding:7px 14px; border-radius:8px;
    cursor:pointer; transition:background .15s, color .15s; white-space:nowrap;
  }
  .tabs button[aria-selected="true"]{background:var(--accent); color:var(--accent-ink)}
  .tabs button:not([aria-selected="true"]):hover{background:var(--line)}
  .desc{font-size:13px; color:var(--sub); min-width:0}
  .desc b{color:var(--ink)}
  main{flex:1; min-height:0; position:relative; background:var(--bg)}
  iframe{
    position:absolute; inset:0; width:100%; height:100%; border:none; background:#fff;
  }
  .hint{
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
    padding-block:6px; font-size:12px; color:var(--sub); background:var(--panel); border-top:1px solid var(--line);
    flex-shrink:0;
  }
  @media (max-width:520px){
    h1{display:none}
    .desc{display:none}
  }
</style>

<header>
  <div class="row">
    <h1>MATH5 · עיצוב</h1>
    <div class="tabs" role="tablist" aria-label="חלופות עיצוב">
      <button role="tab" data-c="a" aria-selected="true">A · TradingView</button>
      <button role="tab" data-c="b" aria-selected="false">B · Minimal Focus</button>
      <button role="tab" data-c="c" aria-selected="false">C · Premium Academic</button>
    </div>
  </div>
  <div class="row">
    <span class="desc" id="desc"></span>
  </div>
</header>
<main>
  <iframe id="frame" title="תצוגת קונספט" src="../concept-a/index.html"></iframe>
</main>
<div class="hint">אבטיפוס עיצובי בלבד — נתוני "התקדמות" הם דמו. ניווט בתוך כל קונספט עובד במלואו (בית → מסלול → שיעור → תרגול).</div>

<script>
  const DESCR = {
    a: '<b>סביבת עבודה מתמטית (TradingView).</b> שני פאנלים חיים f/f’, גרף שמתעדכן לכל צעד, טבלת סימנים ואימות מספרי חי.',
    b: '<b>מרחב עבודה ממוקד (Minimal Focus).</b> כל הסבר מפוצל לצעדים קצרים עם התקדמות אמיתית — תשובה לממצא הצפיפות באודיט.',
    c: '<b>סביבה אקדמית יוקרתית (ספר הלימוד).</b> מבנה פרק/סעיף, הערות שוליים, טיפוגרפיה סריפית עברית.',
  };
  const FILE = { a: '../concept-a/index.html', b: '../concept-b/index.html', c: '../concept-c/index.html' };
  const tabs = [...document.querySelectorAll('.tabs button')];
  const frame = document.getElementById('frame');
  const desc = document.getElementById('desc');

  function show(c, push){
    tabs.forEach(b => b.setAttribute('aria-selected', String(b.dataset.c === c)));
    desc.innerHTML = DESCR[c] || '';
    if (frame.dataset.c !== c) { frame.src = FILE[c]; frame.dataset.c = c; }
    if (push) { try { location.hash = c; } catch(e) {} }
  }

  tabs.forEach(b => b.addEventListener('click', () => show(b.dataset.c, true)));
  addEventListener('hashchange', () => {
    const c = location.hash.replace('#','');
    if (FILE[c]) show(c, false);
  });

  const start = (location.hash.replace('#','')) in FILE ? location.hash.replace('#','') : 'a';
  show(start, false);
</script>
